name: Atualizar painel do perfil

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_profile.py'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter arquivos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Atualizar dados públicos
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Salvar painel atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar painel público do perfil'
            git push
          fi
